<title>MerluHealth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabina de un solo flujo. Una columna de 620 px, cabecera fija, navegación inferior.
   La palabra de la decisión (Barlow Condensed, enorme) es lo único que grita; el resto es sereno. */
:root{
  --bg:#0B1620; --bg2:#101F2B; --bg3:#172B3A; --line:#27424F;
  --fg:#E9F0F4; --fg2:#A9BCC7; --accent:#6CC6E8; --accent-ink:#06222E;
  --go:#5BD08E; --go-bg:#0F3326; --wait:#F4B73F; --wait-bg:#3A2C0C;
  --nogo:#FF7B6E; --nogo-bg:#431915; --unk:#B3BAE6; --unk-bg:#242A4A;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF2F5; --bg2:#FFFFFF; --bg3:#E1EAF0; --line:#BFD0DA;
    --fg:#0F2230; --fg2:#41596A; --accent:#0B6E94; --accent-ink:#FFFFFF;
    --go:#116A45; --go-bg:#DCF4E7; --wait:#7D5200; --wait-bg:#FFEFC9;
    --nogo:#B3261E; --nogo-bg:#FDE2DF; --unk:#413E99; --unk-bg:#E6E8F8; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF2F5; --bg2:#FFFFFF; --bg3:#E1EAF0; --line:#BFD0DA;
  --fg:#0F2230; --fg2:#41596A; --accent:#0B6E94; --accent-ink:#FFFFFF;
  --go:#116A45; --go-bg:#DCF4E7; --wait:#7D5200; --wait-bg:#FFEFC9;
  --nogo:#B3261E; --nogo-bg:#FDE2DF; --unk:#413E99; --unk-bg:#E6E8F8; color-scheme:light;
}
[data-lv="go"]{--lv:var(--go);--lv-bg:var(--go-bg)}
[data-lv="wait"]{--lv:var(--wait);--lv-bg:var(--wait-bg)}
[data-lv="nogo"]{--lv:var(--nogo);--lv-bg:var(--nogo-bg)}
[data-lv="unk"]{--lv:var(--unk);--lv-bg:var(--unk-bg)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
html.big body{font-size:19px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:620px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand b{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.brand span{font-size:12.5px;color:var(--fg2);line-height:1.25}
.tools{display:flex;gap:6px;flex:none}
.ibtn{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:grid;place-items:center;font:600 13px var(--f-body)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font-size:12.5px;font-weight:500;color:var(--fg2)}
.chip.sim{border-color:var(--wait);color:var(--wait)}
.chip.lv{border-color:var(--lv);color:var(--lv);background:var(--lv-bg)}

/* Vistas */
main{padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main>*{min-width:0}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font:700 24px/1.1 var(--f-display);letter-spacing:.02em;margin-bottom:6px}
.card h3{font:600 15px/1.3 var(--f-body);margin-bottom:6px}
.muted{color:var(--fg2)} .small{font-size:13.5px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{border-color:var(--nogo);color:var(--nogo);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Fases */
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;margin:0;padding:0}
.phases li{font-size:12px;line-height:1.2;text-align:center;color:var(--fg2);padding-top:10px;border-top:4px solid var(--line)}
.phases li[aria-current="step"]{color:var(--fg);font-weight:600;border-top-color:var(--accent)}
.phases li.done{border-top-color:var(--go)}

/* Nivel de estimación */
.level{border:1px solid var(--lv);background:var(--lv-bg);border-radius:14px;padding:16px;display:grid;gap:8px}
.level .word{font:700 52px/1 var(--f-display);color:var(--lv);text-transform:uppercase;letter-spacing:.02em}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.flist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist .fl{font-weight:600}
.flist .fd{grid-column:1;color:var(--fg2);font-size:14px}
.tag{align-self:start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tag.up{color:var(--wait)} .tag.ok{color:var(--go)} .tag.ctx{color:var(--accent)} .tag.missing,.tag.stale,.tag.invalid{color:var(--unk)}

/* Lista de preparación */
.check{display:grid;grid-template-columns:36px 1fr;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;cursor:pointer;min-height:64px}
.check .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--fg2);display:grid;place-items:center}
.check[aria-checked="true"]{border-color:var(--go)}
.check[aria-checked="true"] .box{background:var(--go);border-color:var(--go);color:var(--bg)}
.check b{display:block}
.bar{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.bar.go>i{background:var(--go)}

/* Evaluación */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;list-style:none;margin:0;padding:0}
.steps li{font-size:13px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--bg3);color:var(--fg2)}
.steps li[aria-current="step"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.steps li.done{color:var(--go)}
.timer{font:700 clamp(72px,24vw,112px)/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.instr{font:600 24px/1.25 var(--f-body);text-wrap:balance}
.hrnow{font:600 40px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.spark{width:100%;height:64px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.spark line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--fg2)}
.in{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;font:500 18px var(--f-mono)}
.in:disabled{opacity:.45}
select.in{font-family:var(--f-body);font-size:16px}
.sym-btn{min-height:56px;font-size:17px}
.warn{border:1px solid var(--wait);background:var(--wait-bg);color:var(--fg);border-radius:12px;padding:12px;font-size:15px}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--fg2)}

/* Tarjeta de decisión */
.dcard{border:2px solid var(--lv);background:var(--lv-bg);border-radius:18px;padding:18px;display:grid;gap:14px}
.dcard .word{font:700 clamp(44px,13vw,88px)/.95 var(--f-display);color:var(--lv);text-transform:uppercase;text-wrap:balance;letter-spacing:.01em;overflow-wrap:anywhere}
.split{flex-wrap:wrap}
.dcard.expired{opacity:.55}
.next{background:var(--bg);border-radius:12px;padding:14px;font:600 19px/1.35 var(--f-body)}
.reasons{margin:0;padding-left:20px;display:grid;gap:4px}
.mt{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.mt b{display:block;font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}
.mt span{font-size:12.5px;color:var(--fg2)}
.cd{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums}

/* Registro */
.log{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.log li{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:12px;display:grid;gap:6px;border-left:6px solid var(--lv,var(--line))}
.log pre,.jsonout{margin:0;max-height:260px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px;font:12px/1.4 var(--f-mono);white-space:pre-wrap;word-break:break-word;width:100%}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:1fr 96px;gap:4px 10px;align-items:center}
.rule .og{grid-column:1/-1;margin-top:-4px}
.refs{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px;color:var(--fg2)}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg2);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
nav.bottom .in-nav{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.bottom button{min-height:56px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--fg2);display:grid;place-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:4px 0}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent);background:var(--bg3)}

/* Hoja de síntomas */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:grid;align-items:end;justify-items:center}
#sheet .panel{width:100%;max-width:620px;background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:92%;overflow:auto}
#sheet label.opt{display:flex;gap:12px;align-items:center;min-height:52px;border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer}
#sheet label.opt input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:50}
@media (prefers-reduced-motion: no-preference){ .bar>i{transition:width .25s linear} .btn{transition:border-color .15s} }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M5 20h5l3-9 4 14 3-8 2 3h5"/></svg>
        <div><b>MerluHealth</b><br><span id="tag"></span></div>
      </div>
      <div class="tools">
        <button class="ibtn" id="btn-lang" data-act="lang" aria-label="Language">ES</button>
        <button class="ibtn" id="btn-theme" data-act="theme" aria-label="Theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="bottom" aria-label="Main"><div class="in-nav" id="nav"></div></nav>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* ============================================================
   MERLUHEALTH · MOTOR DE REGLAS (puro, sin DOM)
   Todo umbral vive en DEFAULT_RULES y es editable desde la app.
   Origen de cada valor: 'clinical' (criterio clínico publicado),
   'ref' (valor de referencia de la literatura), 'protocol'
   (protocolo publicado) o 'prov' (provisional, sin validar).
   No es un dispositivo médico. No calcula probabilidades.
   ============================================================ */
const SEVERE = ['presync', 'faint'];
const SYMS = ['dizzy', 'vision', 'nausea', 'weak', 'palp', 'presync', 'faint'];

const DEFAULT_RULES = {
  version: '0.1-provisional',
  durations: { rest: 900, lying: 300, sit: 30, stand: 180 }, // s
  th: {
    sbp_drop_ho: 20, dbp_drop_ho: 10,      // criterio clínico de hipotensión ortostática
    sbp_drop_marg: 15, dbp_drop_marg: 8,   // zona límite (provisional)
    hr_rise_marg: 30,                      // referencia: ≥30 lpm en adultos
    hr_dev_base: 15, sbp_low: 95,
    fluid_target_ml: 1000,
    comp_low: 50, comp_ok: 80,
    long_days: 90,
    age_hr: 60, age_bp: 60, age_fluid: 720, // min
    valid_go: 30, repeat_wait: 20, repeat_nogo: 45, // min
    pts_mod: 2, pts_high: 5                 // interno: puntos -> nivel. Nunca se muestran.
  },
  ranges: { hr: [30, 220], sbp: [50, 260], dbp: [30, 150], fluid: [0, 5000], pct: [0, 100] },
  origin: {
    sbp_drop_ho: 'clinical', dbp_drop_ho: 'clinical', hr_rise_marg: 'ref',
    du_lying: 'protocol', du_sit: 'protocol', du_stand: 'protocol'
  }
};

const rangeOk = (v, r) => typeof v === 'number' && isFinite(v) && v >= r[0] && v <= r[1];

/* ---------- 1. Estimación previa (bajo / moderado / alto / indeterminado) ---------- */
function estimateRisk(inp, R) {
  const th = R.th, rg = R.ranges, F = [], crit = [];
  let pts = 0, severe = false;
  const add = (id, st, p, w) => { F.push({ id, st, p: p || {} }); pts += (w || 0); };
  const state = (val, range, age, maxAge) =>
    val == null ? 'missing' : !rangeOk(val, range) ? 'invalid' : (age != null && age > maxAge) ? 'stale' : 'ok';

  // FC en reposo vs. línea base personal (contexto de peso bajo)
  const hr = inp.hr || {};
  const hs = state(hr.value, rg.hr, hr.ageMin, th.age_hr);
  if (hs !== 'ok') { add('hr', hs, { age: hr.ageMin }); crit.push('hr'); }
  else {
    const d = hr.value - inp.baseHr;
    if (rangeOk(inp.baseHr, rg.hr) && d >= th.hr_dev_base) add('hr', 'up', { v: hr.value, b: inp.baseHr, d }, 1);
    else add('hr', 'ok', { v: hr.value, b: inp.baseHr });
  }
  // Presión en reposo (no es dato crítico; sin ella la prueba la pedirá)
  const bp = inp.bp || {};
  const bs = state(bp.sbp, rg.sbp, bp.ageMin, th.age_bp);
  const bsd = bs === 'ok' && !rangeOk(bp.dbp, rg.dbp) ? 'invalid' : bs;
  if (bsd !== 'ok') add('bp', bsd, { age: bp.ageMin });
  else if (bp.sbp < th.sbp_low) add('bp', 'up', { s: bp.sbp, d: bp.dbp }, 1);
  else add('bp', 'ok', { s: bp.sbp, d: bp.dbp });
  // Líquidos (registro; la hidratación no se mide con un reloj)
  const fl = inp.fluid || {};
  const fs = state(fl.ml, rg.fluid, fl.ageMin, th.age_fluid);
  if (fs !== 'ok') { add('fluid', fs, { age: fl.ageMin }); crit.push('fluid'); }
  else {
    const pct = Math.round(fl.ml / th.fluid_target_ml * 100);
    add('fluid', pct < 70 ? 'up' : pct < 90 ? 'up' : 'ok', { ml: fl.ml, pct }, pct < 70 ? 2 : pct < 90 ? 1 : 0);
  }
  // Prenda de compresión
  if (inp.compression === false) add('compression', 'up', {}, 1); else add('compression', 'ok', {});
  // Cumplimiento de contramedidas durante la misión
  const cs = state(inp.compliance, rg.pct);
  if (cs !== 'ok') { add('compliance', cs, {}); crit.push('compliance'); }
  else add('compliance', inp.compliance < th.comp_ok ? 'up' : 'ok', { v: inp.compliance },
    inp.compliance < th.comp_low ? 2 : inp.compliance < th.comp_ok ? 1 : 0);
  // Duración
  add('duration', inp.days >= th.long_days ? 'up' : 'ok', { d: inp.days }, inp.days >= th.long_days ? 1 : 0);
  // Contexto sin peso
  add('gravity', 'ctx', { g: inp.dest === 'moon' ? '0,16' : '0,38' });
  add('sex', 'ctx', { sfx: inp.sex === 'F' ? 'F' : 'M' });
  // Síntomas actuales
  const sy = inp.symptoms || [];
  if (sy.length) {
    if (sy.some(s => SEVERE.includes(s))) severe = true;
    add('symptoms', 'up', { n: sy.length }, 2);
  } else add('symptoms', 'ok', {});

  let level = severe ? 'high' : pts >= th.pts_high ? 'high' : pts >= th.pts_mod ? 'mod' : 'low';
  if (!severe) {
    if (crit.length >= 2) level = 'unk';
    else if (crit.length === 1 && level === 'low') level = 'unk'; // "bajo" con datos faltantes no existe
  }
  const bpOk = F.find(f => f.id === 'bp').st === 'ok' || F.find(f => f.id === 'bp').st === 'up';
  const conf = crit.length === 0 ? (bpOk ? 'high' : 'mid') : 'low';
  return { level, conf, factors: F, missing: crit, pts };
}

/* ---------- 2. Métricas de la prueba de pie ---------- */
function metrics(rd, R) {
  const rg = R.ranges, L = rd.lying || {};
  const st = [rd.stand1, rd.stand3].filter(Boolean);
  const lyBp = rangeOk(L.sbp, rg.sbp) && rangeOk(L.dbp, rg.dbp);
  const stBp = st.filter(s => rangeOk(s.sbp, rg.sbp) && rangeOk(s.dbp, rg.dbp));
  const bpOk = lyBp && stBp.length > 0;
  const stHr = st.filter(s => rangeOk(s.hr, rg.hr));
  const hrOk = rangeOk(L.hr, rg.hr) && stHr.length > 0;
  return {
    bpOk, hrOk,
    dSbp: bpOk ? Math.max(0, L.sbp - Math.min(...stBp.map(s => s.sbp))) : null,
    dDbp: bpOk ? Math.max(0, L.dbp - Math.min(...stBp.map(s => s.dbp))) : null,
    dHr: hrOk ? Math.max(...stHr.map(s => s.hr)) - L.hr : null,
    sitRise: rd.sit && rangeOk(rd.sit.hr, rg.hr) && rangeOk(L.hr, rg.hr) ? rd.sit.hr - L.hr : null
  };
}

/* ---------- 3. Decisión (puede caminar / espera / no salgas / datos insuficientes) ---------- */
function decide(rd, sym, stopped, pre, R) {
  const th = R.th, m = metrics(rd || {}, R), reasons = [];
  sym = sym || [];
  const out = (level, next, repeat, valid) =>
    ({ level, next, reasons, repeatMin: repeat || null, validMin: valid || null, metrics: m, symptoms: sym });
  if (sym.some(s => SEVERE.includes(s))) { reasons.push({ c: 'sym_severe' }); return out('nogo', 'lie_down', th.repeat_nogo); }
  if (stopped) {
    reasons.push({ c: 'stopped', p: { n: sym.length } });
    return sym.length >= 2 ? out('nogo', 'lie_down', th.repeat_nogo) : out('wait', 'lie_down', th.repeat_wait);
  }

/* ---------- flujo de la prueba ---------- */
function startTest() { T = newTest(); T.stage = 'gate'; render(); speak(t('say_gate')); }
function beginStage(name) { T.stage = name; T.start = Date.now(); T.await = false; T.series = []; T.s1open = false; render(); speak(t('say_' + name)); }
function prefill(key) {
  if (T.rd[key] && Object.keys(T.rd[key]).length) return;
  let v = null;
  if (S.src === 'sim') v = simRead(PROF[S.profile], key);
  else if (S.src === 'ble' && LIVE.hr != null && Date.now() - LIVE.ts < 15000) v = { hr: LIVE.hr };
  if (v) T.rd[key] = v;
}
function enterAwait() {
  const st = T.stage;
  if (st === 'rest') { beginStage('lying'); return; }
  T.await = true;
  prefill(st === 'lying' ? 'lying' : st === 'sit' ? 'sit' : 'stand3');
  if (st === 'stand') prefill('stand1');
  render(); speak(t('say_capture'));
}
function liveHr(stage, e) {
  if (S.src === 'sim') return simHr(PROF[S.profile], stage === 'rest' ? 'lying' : stage, e);
  if (S.src === 'ble' && LIVE.hr != null && Date.now() - LIVE.ts < 15000) return LIVE.hr;
  return null;
}
function tick() {
  if (S.tab === 'decision' && S.last) {
    const rem = remaining(S.last), cd = $('#cd');
    if (rem != null && cd) {
      cd.textContent = mmss(rem);
      if (rem <= 0 && !S.last.expShown) { S.last.expShown = true; save(); render(); }
    }
  }
  if (!TIMED.includes(T.stage) || S.tab !== 'test') return;
  const dur = S.rules.durations[T.stage];
  let e = T.await ? dur : (Date.now() - T.start) / 1000 * S.speed;
  if (!T.await && e >= dur) { enterAwait(); return; }
  const hr = liveHr(T.stage, e);
  if (hr != null && !T.await) T.series.push(hr);
  if (T.series.length > 240) T.series.shift();
  const tm = $('#tm'); if (!tm) return;
  tm.textContent = mmss(dur - e);
  $('#bar').style.width = Math.min(100, e / dur * 100) + '%';
  $('#hrnow').textContent = hr == null ? '—' : Math.round(hr);
  const sp = $('#spk'); if (sp) sp.setAttribute('points', sparkPts());
  if (T.stage === 'stand' && !T.await) {
    if (!T.s1open && e >= 60) { T.s1open = true; prefill('stand1'); render(); return; }
    const P = PROF[S.profile];
    if (S.src === 'sim' && P.resp.stopAt != null && e >= P.resp.stopAt) {
      toast(t('sy_sim', { list: P.resp.stopSym.map(s => t('sym_' + s)).join(', ') }));
      T.sym = P.resp.stopSym.slice(); finishTest(true);
    }
  }
}
function finishTest(stopped) {
  const rd = clone(T.rd);
  if (S.noCuff) Object.keys(rd).forEach(k => { delete rd[k].sbp; delete rd[k].dbp; });
  const p = pre(), dec = decide(rd, T.sym, stopped, p, S.rules);
  S.last = { ts: Date.now(), speed: S.speed, dec, pre: { level: p.level, conf: p.conf }, rd };
  const L = rd.lying;
  if (L && rangeOk(L.hr, S.rules.ranges.hr)) S.inputs.hr = { value: L.hr, ageMin: 0 };
  if (L && rangeOk(L.sbp, S.rules.ranges.sbp) && rangeOk(L.dbp, S.rules.ranges.dbp)) S.inputs.bp = { sbp: L.sbp, dbp: L.dbp, ageMin: 0 };
  addLog('eval', dec.level, 'dw_' + dec.level, {}, dec.reasons, {
    rules: S.rules.version, source: S.src, profile: S.src === 'sim' ? S.profile : null,
    pre: { level: p.level, confidence: p.conf, factors: p.factors.map(f => ({ id: f.id, status: f.st })) },
    readings: rd, symptoms: T.sym, metrics: dec.metrics, thresholds: S.rules.th
  });
  T = newTest(); S.tab = 'decision'; save(); render(); window.scrollTo(0, 0);
  try { location.hash = 'decision'; } catch (e) { }
  speak(t('dw_' + dec.level) + '. ' + t('nx_' + dec.next));
}
function reportSymptoms(list) {
  if (!list.length) return;
  const p = pre(), dec = decide({}, list, true, p, S.rules); dec.reasons.unshift({ c: 'new_sym' });
  S.last = { ts: Date.now(), speed: S.speed, dec, pre: { level: p.level, conf: p.conf }, rd: {} };
  addLog('symptom', dec.level, 'dw_' + dec.level, {}, dec.reasons, { rules: S.rules.version, symptoms: list });
  T = newTest(); S.tab = 'decision'; save(); render(); window.scrollTo(0, 0);
  speak(t('dw_' + dec.level) + '. ' + t('nx_' + dec.next));
}

/* ---------- Bluetooth (opcional) ---------- */
async function connectBLE() {
  const upd = () => { const el = $('#blestat'); if (el) el.textContent = LIVE.status === 'ok' ? t('b_ok', { hr: LIVE.hr == null ? '—' : LIVE.hr }) : LIVE.status === 'wait' ? t('b_wait') : LIVE.status === 'err' ? t('b_fail', { e: LIVE.err }) : t('b_idle'); };
  if (!navigator.bluetooth) { LIVE.status = 'err'; LIVE.err = t('b_unsupported'); upd(); return; }
  try {
    LIVE.status = 'wait'; upd();
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
    const srv = await dev.gatt.connect(), svc = await srv.getPrimaryService('heart_rate');
    const ch = await svc.getCharacteristic('heart_rate_measurement');
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged', ev => {
      const v = ev.target.value, f = v.getUint8(0);
      LIVE.hr = (f & 1) ? v.getUint16(1, true) : v.getUint8(1); LIVE.ts = Date.now(); LIVE.status = 'ok'; upd();
    });
    LIVE.status = 'ok'; upd();
  } catch (e) { LIVE.status = 'err'; LIVE.err = (e && e.message) || String(e); upd(); }
}

  src: d => { S.src = d.v; save(); render(); },
  speed: d => { S.speed = Number(d.v); save(); render(); },
  toggle: d => { S[d.k] = !S[d.k]; save(); render(); },
  profile: d => { applyProfile(d.v); save(); render(); toast(t('pf_' + d.v)); },
  prep: d => {
    const id = d.id, on = !S.prep[id]; S.prep[id] = on; if (on) S.prepTs[id] = Date.now(); else delete S.prepTs[id];
    addLog('prep', null, on ? 'l_prep_item' : 'l_prep_undo', { item: 'pi_' + id }); save(); render();
  },
  'fluid-add': () => { const f = S.inputs.fluid; f.ml = (f.ml || 0) + 250; f.ageMin = 0; addLog('prep', null, 'l_fluid', { ml: 250 }); save(); render(); },
  'fluid-reset': () => { S.inputs.fluid = { ml: null, ageMin: null }; save(); render(); },
  start: () => startTest(),
  gate: d => { T.gate[d.k] = !T.gate[d.k]; render(); },
  'gate-go': () => beginStage('rest'),
  skiprest: () => beginStage('lying'),
  proceed: () => { const st = T.stage; if (st === 'lying') beginStage('sit'); else if (st === 'sit') beginStage('stand'); else finishTest(false); },
  abort: () => { T = newTest(); render(); },
  again: () => { T = newTest(); go('test'); },
  'sym-open': () => openSheet('test'),
  'report-open': () => openSheet('report'),
  'sym-cancel': () => closeSheet(),
  'sym-ok': () => {
    const list = [...document.querySelectorAll('#sheet input:checked')].map(i => i.value), mode = sheetMode; closeSheet();
    if (mode === 'test') { T.sym = list; finishTest(true); } else reportSymptoms(list);
  },
  'log-send': () => { S.log.forEach(e => { e.sync = 'sent'; }); save(); render(); toast(t('l_sent')); },
  'log-copy': () => {
    const txt = JSON.stringify({ app: 'MerluHealth', rules: S.rules.version, log: S.log }, null, 2);
    const fb = () => { JSONTXT = txt; render(); const ta = $('#jsonout'); if (ta) { ta.focus(); ta.select(); } toast(t('l_copy_fail')); };
    try { navigator.clipboard.writeText(txt).then(() => toast(t('l_copied')), fb); } catch (e) { fb(); }
  },
  'log-clear': () => { if (CONFIRM === 'log') { S.log = []; CONFIRM = null; save(); } else CONFIRM = 'log'; render(); },
  'rules-reset': () => { S.rules = clone(DEFAULT_RULES); save(); render(); },
  'reset-all': () => { if (CONFIRM === 'all') { try { localStorage.removeItem(KEY); } catch (e) { } S = defaults(); T = newTest(); CONFIRM = null; render(); } else { CONFIRM = 'all'; render(); } },
  ble: () => connectBLE()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el.dataset, el); });
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  const path = el.dataset.bind.split('.'), last = path.pop(); let o = S;
  for (const k of path) { if (o[k] == null) o[k] = {}; o = o[k]; }
  o[last] = el.dataset.type === 'str' ? el.value : (el.value === '' ? null : Number(el.value));
  save();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.rd) return;
  const [key, f] = el.dataset.rd.split('.'); T.rd[key] = T.rd[key] || {};
  if (el.value === '') delete T.rd[key][f]; else T.rd[key][f] = Number(el.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== S.tab) { S.tab = h; render(); } });
(function init() {
  const h = (location.hash || '').slice(1); if (TABS.includes(h)) S.tab = h;
  render(); setInterval(tick, 250);
})();
</script>
